name: CI

# Gates every push / PR to main: frontend must BUILD (tsc -b && vite build, the
# exact command Vercel runs) and pass tests; backend must pass tests at the
# .coveragerc coverage threshold. This is the server-side guarantee that a
# non-building / type-broken frontend can never reach main or a Vercel deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (tsc -b && vite build — same as Vercel)
        working-directory: frontend
        run: npm run build

      - name: Test + coverage
        working-directory: frontend
        run: npm run test:coverage

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Test + coverage (fail_under=95 from .coveragerc)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest backend/ --cov --cov-report=term-missing
