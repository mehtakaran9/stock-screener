name: Daily Market Scan

on:
  schedule:
    - cron: '0 16 * * 1-5'   # 12:00 PM EDT (Mar–Nov, UTC-4)
    - cron: '0 17 * * 1-5'   # 12:00 PM EST (Nov–Mar, UTC-5)
  workflow_dispatch:           # Allow manual trigger from GitHub UI
    inputs:
      full_scan:
        description: 'Run the full market scan'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      send_email:
        description: 'Send results email (if full_scan is false, sends a dummy email)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

# Prevent duplicate concurrent runs (e.g. during DST transition weeks)
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write   # needed to push activity ping to keepalive-pings branch
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest backend/ -v --cov --cov-report=term-missing

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:coverage

      - name: Validate email configuration
        run: |
          [ -n "${{ secrets.EMAIL_SMTP_HOST }}" ] || { echo "::error::EMAIL_SMTP_HOST secret not set"; exit 1; }
          [ -n "${{ secrets.EMAIL_USER }}" ]      || { echo "::error::EMAIL_USER secret not set"; exit 1; }
          [ -n "${{ secrets.EMAIL_PASSWORD }}" ]  || { echo "::error::EMAIL_PASSWORD secret not set"; exit 1; }

      - name: Write recipients file
        env:
          EMAIL_LIST: ${{ vars.EMAIL_LIST }}
        run: echo "$EMAIL_LIST" > backend/recipients.txt

      - name: Run scan
        env:
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USER:      ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          PYTHONPATH:      ${{ github.workspace }}
          FULL_SCAN:       ${{ github.event.inputs.full_scan }}
          SEND_EMAIL:      ${{ github.event.inputs.send_email }}
        run: python -m backend.run_scan

      - name: Keep keepalive workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keepalive.yml

      - name: Push activity commit to reset 60-day inactivity clock
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_scan.txt
          git add last_scan.txt
          git commit -m "chore: activity ping [skip ci]"
          git push origin HEAD:refs/heads/keepalive-pings --force \
            || echo "::warning::Activity push failed — 60-day clock may not reset"
