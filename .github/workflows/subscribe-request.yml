name: Subscription Request Approved

on:
  issues:
    types: [labeled]

jobs:
  acknowledge:
    # Only run when the 'approved' label is added to a 'subscribe' issue
    if: >
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'subscribe')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Verify approver is admin
        uses: actions/github-script@v9
        with:
          script: |
            // The repo owner is always an admin — short-circuit so the common case needs
            // no API call. Reading a collaborator's permission level needs repo write/push
            // access, which the default GITHUB_TOKEN under `permissions: issues: write` does
            // not have, so calling it unconditionally would 403. Try it only for non-owners
            // and fail closed (treat as non-admin) on any error instead of crashing the job.
            const sender = context.payload.sender.login;
            let isAdmin = sender === context.repo.owner;
            if (!isAdmin) {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: sender,
                });
                isAdmin = data.permission === 'admin';
              } catch (err) {
                core.warning(`Could not read collaborator permission for ${sender} (${err.status ?? err.message}); treating as non-admin.`);
              }
            }
            if (!isAdmin) {
              core.setFailed(`${sender} is not a repo admin — approval rejected.`);
            }

      - name: Post acknowledgement comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --body "✅ **Request approved.** A maintainer will contact you via your GitHub notification email to collect your address and add you to the list." \
            --repo ${{ github.repository }}
